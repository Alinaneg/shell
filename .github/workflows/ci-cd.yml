name: VFS Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t vfs-test .
      
    - name: Run tests
      run: |
        docker run --rm \
          --privileged \
          vfs-test
