name: CI/CD

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y cmake g++ make python3 python3-pip
        pip3 install pytest
    
    - name: Build and test
      run: |
        # Build
        mkdir -p build
        cd build && cmake .. && make
        ln -s build/kubsh kubsh
        
        # Set PYTHONPATH for imports
        export PYTHONPATH=$PYTHONPATH:$GITHUB_WORKSPACE
        echo "PYTHONPATH set to: $PYTHONPATH"
        
        # Test import
        python3 -c "import utils; print('✓ utils imports OK')" || echo "⚠ utils import failed"
        
        # Run tests
        python3 -m pytest test_basic.py test_vfs.py -v
  
  build-deb:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build DEB
      run: |
        sudo apt install -y devscripts debhelper
        dpkg-buildpackage -us -uc -b
    
    - uses: actions/upload-artifact@v4
      with:
        name: kubsh-deb
        path: ../*.deb
