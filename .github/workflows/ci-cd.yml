name: CI/CD Pipeline

on: 
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          make \
          python3 \
          python3-pip \
          python3-venv
    
    - name: Install Python test dependencies
      run: |
        pip3 install pytest
    
    - name: Build project with clean cache
      run: |
        echo "=== Building kubsh ==="
        
        # ПОЛНАЯ ОЧИСТКА кэша CMake
        rm -rf build
        rm -f CMakeCache.txt 2>/dev/null || true
        rm -rf CMakeFiles/ 2>/dev/null || true
        
        # Сборка
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Debug ..
        make -j$(nproc)
        cd ..
        
        # Создаем симлинк как ожидают тесты
        ln -sf build/kubsh kubsh
        chmod +x kubsh
        
        echo "=== Build completed ==="
        ls -la kubsh build/kubsh
    
    - name: Run Python tests
      run: |
        echo "=== Running tests ==="
        
        # Проверяем что бинарник работает
        echo "Testing kubsh binary:"
        ./kubsh --help 2>&1 | head -3 || true
        
        # Тест импорта utils
        echo "Testing imports:"
        python3 -c "import utils; print('✓ utils imports OK')" || echo "⚠ utils import issue"
        
        # Запускаем тесты
        echo "Running pytest:"
        python3 -m pytest \
          test_basic.py \
          test_vfs.py \
          -v \
          --tb=short
        
        echo "=== Tests completed ==="

  build-deb:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install packaging dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          devscripts \
          debhelper \
          build-essential \
          lintian \
          fakeroot
    
    - name: Build DEB package with clean cache
      run: |
        echo "=== Building DEB package ==="
        
        # Очистка ВСЕХ старых файлов
        rm -rf build
        rm -f ../*.deb ../*.dsc ../*.changes ../*.buildinfo ../*.tar.gz 2>/dev/null || true
        rm -f CMakeCache.txt 2>/dev/null || true
        
        # Сборка пакета
        dpkg-buildpackage -us -uc -b -j$(nproc)
        
        echo "=== Package built ==="
        ls -la ../*.deb ../*.changes 2>/dev/null || echo "No packages found"
    
    - name: Validate DEB package
      run: |
        if ls ../*.deb 1>/dev/null 2>&1; then
          echo "=== Validating package ==="
          DEB_FILE=$(ls ../*.deb | head -1)
          
          echo "Package: $DEB_FILE"
          echo "Size: $(du -h "$DEB_FILE" | cut -f1)"
          
          # Быстрая проверка содержимого
          dpkg-deb -I "$DEB_FILE" | grep -E "(Package|Version|Architecture)" || true
          
          echo "✓ DEB package is valid"
        else
          echo "❌ No DEB package found"
          exit 1
        fi
    
    - name: Upload DEB package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: kubsh-debian-package
        path: ../*.deb
        retention-days: 30
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-info
        path: |
          ../*.changes
          ../*.buildinfo
          ../*.dsc
        if-no-files-found: ignore
