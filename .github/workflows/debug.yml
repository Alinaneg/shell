name: Quick Debug
on: push

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Simple test
      run: |
        docker run --rm --privileged ubuntu:22.04 bash -c "
          apt-get update && apt-get install -y g++ python3
          
          # Создаем простой тестовый файл
          cat > test.cpp << 'EOF'
          #include <iostream>
          #include <sys/stat.h>
          #include <unistd.h>
          using namespace std;
          
          int main() {
              cout << 'Testing mkdir...' << endl;
              if (mkdir('/opt/test', 0755) == 0) {
                  cout << 'Success!' << endl;
              } else {
                  cout << 'Failed: ' << errno << endl;
              }
              return 0;
          }
          EOF
          
          g++ -o test test.cpp
          ./test
          ls -la /opt/
        "
